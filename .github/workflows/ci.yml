name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campusnest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: 3000
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: campusnest
      DB_USER: postgres
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-chars
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-admin-password-123
      CLIENT_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run seed
      - run: npm test
